services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabeet_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: ${APP_NAME:-Diabeet}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-diabeet}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - app_storage:/var/www/storage
    networks:
      - diabeet_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: diabeet_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/public:ro
      - app_storage:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - diabeet_network
    depends_on:
      - app

  db:
    image: postgres:16
    container_name: diabeet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-diabeet}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-diabeet}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - diabeet_network

networks:
  diabeet_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  app_storage:
    driver: local
